<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawn</title>
    <link rel="stylesheet" href="drawing/style.css">
</head>
<body>
    <div id="stage" class="stage">
        <canvas id="canvas"></canvas>

        <button id="start-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
            Click Me
        </button>

        <div id="hud">
            <span id="title"></span>
            <span id="status"></span>
        </div>

        <div id="controls">
            <button id="prev-button" class="control-button">Prev</button>
            <button id="pause-button" class="control-button" disabled>Pause</button>
            <button id="skip-button" class="control-button" disabled>Finish</button>
            <button id="speed-button" class="control-button">1×</button>
            <button id="next-button" class="control-button">Next</button>
            <button id="save-button" class="control-button">Save JPG</button>
            <button id="open-button" class="control-button">Open…</button>
        </div>

        <div id="progress"><div id="progress-bar"></div></div>

        <div id="drop-hint">Drop an image to draw it</div>
        <input id="file-input" type="file" accept="image/*" multiple>
    </div>

    <script type="module" src="drawing/js/main.js"></script>
</body>
</html>
